server.port=8082

spring.application.name=votaciones-service

spring.datasource.url=jdbc:postgresql://localhost:5432/votaciones_db
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuración de Spring Cloud Stream (Kafka)
spring.cloud.stream.function.definition=enviarNotificacionVotacion
spring.cloud.stream.bindings.enviarNotificacionVotacion-out-0.destination=topic-notificaciones
spring.cloud.stream.kafka.binder.brokers=localhost:9092

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=*
