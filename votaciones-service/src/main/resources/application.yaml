spring:
  application:
    name: VOTACIONES-SERVICE

  config:
    import: "configserver:,optional:classpath:application-openapi.yaml"

  cloud:
    config:
      fail-fast: true
      retry:
        initial-interval: 3000
        multiplier: 1.3
        max-interval: 10000
        max-attempts: 20
      username: ${CONFIG_SERVER_USR:config-usr}
      password: ${CONFIG_SERVER_PWD:Config2025!}

---
# ========================================
# PERFIL LOCAL
# ========================================
spring:
  config:
    activate:
      on-profile: local
  cloud:
    config:
      uri: http://localhost:8888
  banner:
    location: classpath:banner-local.txt

---
# ========================================
# PERFIL DOCKER
# ========================================
spring:
  config:
    activate:
      on-profile: docker
  cloud:
    config:
      uri: http://config-server:8888
  banner:
    location: classpath:banner-docker.txt
