server:
  port: 8888

spring:
  application:
    name: config-server
    
  cloud:
    config:
      server:
        git:
          uri: https://github.com/LuwuVelasco/BolivianDigitalizationVotes-Config
          default-label: main
          timeout: 30
          force-pull: true

  security:
    user:
      name: ${CONFIG_SERVER_USR:config-usr}
      password: ${CONFIG_SERVER_PWD:Config2025!}

management:
  endpoint:
    health:
      show-details: ALWAYS
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    root: info
    org.springframework.cloud.config: DEBUG