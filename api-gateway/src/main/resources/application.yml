server:
  port: 8443
  ssl:
    key-store-type: PKCS12
    key-store: classpath:keystore/edge.p12
    key-store-password: password
    key-alias: localhost

spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/Candidatos-demo

  cloud:
    gateway:
      # Habilitar CORS para permitir peticiones desde diferentes orígenes
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      
      default-filters:
        - TokenRelay
      
      routes:
        # ========== RUTAS DE MICROSERVICIOS ==========
        # Servicio de Candidatos
        - id: candidatos_service_route
          uri: lb://MS-CANDIDATOS
          predicates:
            - Path=/ms-candidatos/**
          filters:
            - StripPrefix=1
        
        # Servicio de Usuarios (ruta nueva con StripPrefix)
        - id: usuarios_service_route_new
          uri: lb://USUARIOS-SERVICE
          predicates:
            - Path=/ms-usuarios/**
          filters:
            - StripPrefix=1
        
        # Servicio de Usuarios (ruta legacy)
        - id: usuarios_service_route
          uri: lb://USUARIOS-SERVICE
          predicates:
            - Path=/api/usuarios/**
        
        # Servicio de Notificaciones
        - id: notificaciones_service_route
          uri: lb://MS-NOTIFICACIONES
          predicates:
            - Path=/ms-notificaciones/**
          filters:
            - StripPrefix=1
        
        # Servicio de Votaciones
        - id: votaciones_service_route
          uri: lb://VOTACIONES-SERVICE
          predicates:
            - Path=/api/votaciones/**
        
        # Servicio de Resultados y Estadísticas (ruta nueva con StripPrefix)
        - id: resultados_service_route_new
          uri: lb://MS-RESULTADOS
          predicates:
            - Path=/ms-resultados/**
          filters:
            - StripPrefix=1
        
        # Servicio de Resultados y Estadísticas (ruta legacy)
        - id: resultados_service_route
          uri: lb://RESULTADOS-SERVICE
          predicates:
            - Path=/api/resultados/**
        
        # ========== RUTAS PARA SWAGGER/OPENAPI ==========
        # Swagger de Usuarios Service
        - id: usuarios_swagger
          uri: lb://USUARIOS-SERVICE
          predicates:
            - Path=/usuarios/swagger-ui/**
          filters:
            - RewritePath=/usuarios/swagger-ui/(?<segment>.*), /swagger-ui/$\{segment}
        
        - id: usuarios_api_docs
          uri: lb://USUARIOS-SERVICE
          predicates:
            - Path=/usuarios/v3/api-docs/**
          filters:
            - RewritePath=/usuarios/v3/api-docs/(?<segment>.*), /v3/api-docs/$\{segment}
        
        # Swagger de Votaciones Service
        - id: votaciones_swagger
          uri: lb://VOTACIONES-SERVICE
          predicates:
            - Path=/votaciones/swagger-ui/**
          filters:
            - RewritePath=/votaciones/swagger-ui/(?<segment>.*), /swagger-ui/$\{segment}
        
        - id: votaciones_api_docs
          uri: lb://VOTACIONES-SERVICE
          predicates:
            - Path=/votaciones/v3/api-docs/**
          filters:
            - RewritePath=/votaciones/v3/api-docs/(?<segment>.*), /v3/api-docs/$\{segment}
        
        # Swagger de Resultados Service
        - id: resultados_swagger
          uri: lb://RESULTADOS-SERVICE
          predicates:
            - Path=/resultados/swagger-ui/**
          filters:
            - RewritePath=/resultados/swagger-ui/(?<segment>.*), /swagger-ui/$\{segment}
        
        - id: resultados_api_docs
          uri: lb://RESULTADOS-SERVICE
          predicates:
            - Path=/resultados/v3/api-docs/**
          filters:
            - RewritePath=/resultados/v3/api-docs/(?<segment>.*), /v3/api-docs/$\{segment}
        
        # ========== RUTAS PARA ACTUATOR ==========
        # Actuator de Usuarios Service
        - id: usuarios_actuator
          uri: lb://USUARIOS-SERVICE
          predicates:
            - Path=/usuarios/actuator/**
          filters:
            - RewritePath=/usuarios/actuator/(?<segment>.*), /actuator/$\{segment}
        
        # Actuator de Votaciones Service
        - id: votaciones_actuator
          uri: lb://VOTACIONES-SERVICE
          predicates:
            - Path=/votaciones/actuator/**
          filters:
            - RewritePath=/votaciones/actuator/(?<segment>.*), /actuator/$\{segment}
        
        # Actuator de Resultados Service
        - id: resultados_actuator
          uri: lb://RESULTADOS-SERVICE
          predicates:
            - Path=/resultados/actuator/**
          filters:
            - RewritePath=/resultados/actuator/(?<segment>.*), /actuator/$\{segment}

app:
  eureka-server: localhost

eureka:
  client:
    serviceUrl:
      defaultZone: http://${app.eureka-server}:8861/eureka/
    initialInstanceInfoReplicationIntervalSeconds: 5
    registryFetchIntervalSeconds: 5
  instance:
    leaseRenewalIntervalInSeconds: 5
    leaseExpirationDurationInSeconds: 5

management:
  endpoint:
    health:
      show-details: "ALWAYS"
  endpoints:
    web:
      exposure:
        include: "health,info"

logging:
  level:
    root: INFO
    org.springframework.security: DEBUG