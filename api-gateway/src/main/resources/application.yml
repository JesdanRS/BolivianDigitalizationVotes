server:
  # El puerto estándar para los gateways. Tu app externa llamará a este puerto.
  port: 8080

spring:
  application:
    name: api-gateway
  
  # =======================================================
  # CONFIGURACIÓN DE LAS RUTAS DEL GATEWAY
  # =======================================================
  cloud:
    gateway:
      # Habilitar CORS para permitir peticiones desde diferentes orígenes
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      
      routes:
        # ========== RUTAS DE MICROSERVICIOS ==========
        # Servicio de Usuarios
        - id: usuarios_service_route
          uri: lb://USUARIOS-SERVICE
          predicates:
            - Path=/api/usuarios/**
        
        # Servicio de Votaciones
        - id: votaciones_service_route
          uri: lb://VOTACIONES-SERVICE
          predicates:
            - Path=/api/votaciones/**
        
        # Servicio de Resultados y Estadísticas
        - id: resultados_service_route
          uri: lb://RESULTADOS-ESTADISTICAS
          predicates:
            - Path=/ms-resultados/**
          filters:
            - StripPrefix=1
        
        # ========== RUTAS PARA SWAGGER/OPENAPI ==========
        # Swagger de Usuarios Service
        - id: usuarios_swagger
          uri: lb://USUARIOS-SERVICE
          predicates:
            - Path=/usuarios/swagger-ui/**
          filters:
            - RewritePath=/usuarios/swagger-ui/(?<segment>.*), /swagger-ui/$\{segment}
        
        - id: usuarios_api_docs
          uri: lb://USUARIOS-SERVICE
          predicates:
            - Path=/usuarios/v3/api-docs/**
          filters:
            - RewritePath=/usuarios/v3/api-docs/(?<segment>.*), /v3/api-docs/$\{segment}
        
        # Swagger de Votaciones Service
        - id: votaciones_swagger
          uri: lb://VOTACIONES-SERVICE
          predicates:
            - Path=/votaciones/swagger-ui/**
          filters:
            - RewritePath=/votaciones/swagger-ui/(?<segment>.*), /swagger-ui/$\{segment}
        
        - id: votaciones_api_docs
          uri: lb://VOTACIONES-SERVICE
          predicates:
            - Path=/votaciones/v3/api-docs/**
          filters:
            - RewritePath=/votaciones/v3/api-docs/(?<segment>.*), /v3/api-docs/$\{segment}
        
        # Swagger de Resultados Service
        - id: resultados_swagger
          uri: lb://RESULTADOS-ESTADISTICAS
          predicates:
            - Path=/ms-resultados/swagger-ui/**
          filters:
            - RewritePath=/ms-resultados/swagger-ui/(?<segment>.*), /swagger-ui/$\{segment}
        
        - id: resultados_api_docs
          uri: lb://RESULTADOS-ESTADISTICAS
          predicates:
            - Path=/ms-resultados/v3/api-docs/**
          filters:
            - RewritePath=/ms-resultados/v3/api-docs/(?<segment>.*), /v3/api-docs/$\{segment}
        
        # ========== RUTAS PARA ACTUATOR ==========
        # Actuator de Usuarios Service
        - id: usuarios_actuator
          uri: lb://USUARIOS-SERVICE
          predicates:
            - Path=/usuarios/actuator/**
          filters:
            - RewritePath=/usuarios/actuator/(?<segment>.*), /actuator/$\{segment}
        
        # Actuator de Votaciones Service
        - id: votaciones_actuator
          uri: lb://VOTACIONES-SERVICE
          predicates:
            - Path=/votaciones/actuator/**
          filters:
            - RewritePath=/votaciones/actuator/(?<segment>.*), /actuator/$\{segment}
        
        # Actuator de Resultados Service
        - id: resultados_actuator
          uri: lb://RESULTADOS-ESTADISTICAS
          predicates:
            - Path=/ms-resultados/actuator/**
          filters:
            - RewritePath=/ms-resultados/actuator/(?<segment>.*), /actuator/$\{segment}

# El Gateway también es un cliente de Eureka, necesita registrarse y descubrir otros.
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        # Le decimos que exponga los endpoints de salud e información.
        # Para desarrollo, a veces es útil poner "*" para exponer todos.
        include: health,info