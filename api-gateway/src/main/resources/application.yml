server:
  port: 8080

spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          # SecurityConfig usa jwk-set-uri
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://host.docker.internal:8090/realms/votaciones-realm/protocol/openid-connect/certs}

  cloud:
    gateway:
      routes:
        # ========== RUTAS DE MICROSERVICIOS ==========

        # Candidatos Service
        - id: candidatos_service_route
          uri: lb://candidatos
          predicates:
            - Path=/ms-candidatos/**
          filters:
            - StripPrefix=1

        # Usuarios Service (ruta nueva con StripPrefix)
        - id: usuarios_service_route_new
          uri: lb://usuarios-service
          predicates:
            - Path=/ms-usuarios/**
          filters:
            - StripPrefix=1

        # Usuarios Service (ruta legacy)
        - id: usuarios_service_route
          uri: lb://usuarios-service
          predicates:
            - Path=/api/usuarios/**

        # Notificaciones Service
        - id: notificaciones_service_route
          uri: lb://notificaciones-service
          predicates:
            - Path=/ms-notificaciones/**
          filters:
            - StripPrefix=1

        # Votaciones Service
        - id: votaciones_service_route
          uri: lb://votaciones-service
          predicates:
            - Path=/api/votaciones/**

        # Resultados y Estadísticas (ruta nueva con StripPrefix)
        - id: resultados_service_route_new
          uri: lb://RESULTADOS-ESTADISTICAS-SERVICE
          predicates:
            - Path=/ms-resultados/**
          filters:
            - StripPrefix=1

        # Resultados y Estadísticas (ruta legacy)
        - id: resultados_service_route
          uri: lb://RESULTADOS-ESTADISTICAS-SERVICE
          predicates:
            - Path=/api/resultados/**

        # Auditoría Registros (negocio)
        - id: auditoria-registros
          uri: lb://AUDITORIA-REGISTROS-SERVICE
          predicates:
            - Path=/api/auditoria/**
          filters:
            - StripPrefix=0

        # ========== RUTAS PARA SWAGGER/OPENAPI (UI + DOCS) ==========

        # --- Usuarios ---
        - id: usuarios_swagger
          uri: lb://RESULTADOS-ESTADISTICAS-SERVICE
          predicates:
            - Path=/docs/usuarios/swagger-ui/**
          filters:
            - RewritePath=/docs/usuarios/swagger-ui/(?<segment>.*), /swagger-ui/${segment}

        - id: usuarios_api_docs
          uri: lb://usuarios-service
          predicates:
            - Path=/docs/usuarios/v3/api-docs
          filters:
            - RewritePath=/docs/usuarios/v3/api-docs, /v3/api-docs

        # --- Votaciones ---
        - id: votaciones_swagger
          uri: lb://votaciones-service
          predicates:
            - Path=/docs/votaciones/swagger-ui/**
          filters:
            - RewritePath=/docs/votaciones/swagger-ui/(?<segment>.*), /swagger-ui/${segment}

        - id: votaciones_api_docs
          uri: lb://votaciones-service
          predicates:
            - Path=/docs/votaciones/v3/api-docs
          filters:
            - RewritePath=/docs/votaciones/v3/api-docs, /v3/api-docs

        # --- Resultados/Estadísticas ---
        - id: resultados_swagger
          uri: lb://RESULTADOS-ESTADISTICAS-SERVICE
          predicates:
            - Path=/docs/resultados/swagger-ui/**
          filters:
            - RewritePath=/docs/resultados/swagger-ui/(?<segment>.*), /swagger-ui/${segment}

        - id: resultados_api_docs
          uri: lb://RESULTADOS-ESTADISTICAS-SERVICE
          predicates:
            - Path=/docs/resultados/v3/api-docs
          filters:
            - RewritePath=/docs/resultados/v3/api-docs, /v3/api-docs

        # --- Candidatos ---
        - id: candidatos_swagger
          uri: lb://candidatos
          predicates:
            - Path=/docs/candidatos/swagger-ui/**
          filters:
            - RewritePath=/docs/candidatos/swagger-ui/(?<segment>.*), /swagger-ui/${segment}

        - id: candidatos_api_docs
          uri: lb://candidatos
          predicates:
            - Path=/docs/candidatos/v3/api-docs
          filters:
            - RewritePath=/docs/candidatos/v3/api-docs, /v3/api-docs

        # --- Auditoría (docs vía gateway) ---
        - id: auditoria-openapi
          uri: lb://AUDITORIA-REGISTROS-SERVICE
          predicates:
            - Path=/docs/auditoria/v3/api-docs
          filters:
            - RewritePath=/docs/auditoria/v3/api-docs, /v3/api-docs

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
  instance:
    hostname: ${HOSTNAME:localhost}
    prefer-ip-address: false

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      enabled: true
    health:
      show-details: always

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: Auditoria Service
        url: /docs/auditoria/v3/api-docs
      - name: Usuarios Service
        url: /docs/usuarios/v3/api-docs
      - name: Votaciones Service
        url: /docs/votaciones/v3/api-docs
      - name: Resultados Service
        url: /docs/resultados/v3/api-docs
      - name: Candidatos Service
        url: /docs/candidatos/v3/api-docs

logging:
  level:
    root: INFO
    "[org.springframework.cloud.gateway]": DEBUG
    "[org.springframework.cloud.loadbalancer]": DEBUG
    "[com.netflix.discovery]": DEBUG
    "[org.springframework.security]": TRACE
    "[org.springframework.security.oauth2]": TRACE
