server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: false
      routes:
        # ===== AUDITORIA SERVICE ROUTES =====
        - id: auditoria-openapi
          uri: lb://AUDITORIA-REGISTROS-SERVICE
          predicates:
            - Path=/api/auditoria/v3/api-docs
          filters:
            - RewritePath=/api/auditoria/v3/api-docs, /v3/api-docs
        
        - id: auditoria-registros
          uri: lb://AUDITORIA-REGISTROS-SERVICE
          predicates:
            - Path=/api/auditoria/**
          filters:
            - StripPrefix=0
        
        # ===== RESULTADOS SERVICE ROUTES =====
        # Ruta para OpenAPI docs (Swagger JSON)
        - id: resultados-openapi
          uri: lb://RESULTADOS-ESTADISTICAS-SERVICE
          predicates:
            - Path=/api/resultados/v3/api-docs
          filters:
            - RewritePath=/api/resultados/v3/api-docs, /v3/api-docs
        
        # Ruta principal para todos los endpoints del servicio
        - id: resultados-estadisticas
          uri: lb://RESULTADOS-ESTADISTICAS-SERVICE
          predicates:
            - Path=/api/resultados/**
          filters:
            - StripPrefix=0
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://host.docker.internal:8090/realms/votaciones/protocol/openid-connect/certs}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
  instance:
    hostname: ${HOSTNAME:localhost}
    prefer-ip-address: false

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      enabled: true
    health:
      show-details: always

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: Auditoria Service
        url: /api/auditoria/v3/api-docs
      - name: Resultados y Estadisticas Service
        url: /api/resultados/v3/api-docs

logging:
  level:
    root: INFO
    '[org.springframework.cloud.gateway]': DEBUG
    '[org.springframework.cloud.loadbalancer]': DEBUG
    '[com.netflix.discovery]': DEBUG
    '[org.springframework.security]': TRACE
    '[org.springframework.security.oauth2]': TRACE