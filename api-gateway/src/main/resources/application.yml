server:
  port: 8080

spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          # SecurityConfig usa jwk-set-uri
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://host.docker.internal:8090/realms/votaciones/protocol/openid-connect/certs}

  cloud:
    gateway:
      # Descubrimiento vía Eureka
      discovery:
        locator:
          enabled: true
          lower-case-service-id: false

      # CORS global (frontend)
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

      # Propagar token a los servicios
      default-filters:
        - TokenRelay

      routes:
        # ========== RUTAS DE MICROSERVICIOS ==========

        # Candidatos Service
        - id: candidatos_service_route
          uri: lb://candidatos
          predicates:
            - Path=/ms-candidatos/**
          filters:
            - StripPrefix=1

        # Usuarios Service (ruta nueva con StripPrefix)
        - id: usuarios_service_route_new
          uri: lb://usuarios-service
          predicates:
            - Path=/ms-usuarios/**
          filters:
            - StripPrefix=1

        # Usuarios Service (ruta legacy)
        - id: usuarios_service_route
          uri: lb://usuarios-service
          predicates:
            - Path=/api/usuarios/**

        # Notificaciones Service
        - id: notificaciones_service_route
          uri: lb://notificaciones-service
          predicates:
            - Path=/ms-notificaciones/**
          filters:
            - StripPrefix=1

        # Votaciones Service
        - id: votaciones_service_route
          uri: lb://votaciones-service
          predicates:
            - Path=/api/votaciones/**

        # Resultados y Estadísticas (ruta nueva con StripPrefix)
        - id: resultados_service_route_new
          uri: lb://resultados-service
          predicates:
            - Path=/ms-resultados/**
          filters:
            - StripPrefix=1

        # Resultados y Estadísticas (ruta legacy)
        - id: resultados_service_route
          uri: lb://resultados-service
          predicates:
            - Path=/api/resultados/**

        # Auditoría Registros (negocio)
        - id: auditoria-registros
          uri: lb://AUDITORIA-REGISTROS-SERVICE
          predicates:
            - Path=/api/auditoria/**
          filters:
            - StripPrefix=0

        # ========== RUTAS PARA SWAGGER/OPENAPI (UI + DOCS) ==========

        # --- Usuarios ---
        - id: usuarios_swagger
          uri: lb://usuarios-service
          predicates:
            - Path=/usuarios/swagger-ui/**
          filters:
            - RewritePath=/usuarios/swagger-ui/(?<segment>.*), /swagger-ui/$\{segment}

        - id: usuarios_api_docs
          uri: lb://usuarios-service
          predicates:
            - Path=/api/usuarios/v3/api-docs
          filters:
            - RewritePath=/api/usuarios/v3/api-docs, /v3/api-docs

        # --- Votaciones ---
        - id: votaciones_swagger
          uri: lb://votaciones-service
          predicates:
            - Path=/votaciones/swagger-ui/**
          filters:
            - RewritePath=/votaciones/swagger-ui/(?<segment>.*), /swagger-ui/$\{segment}

        - id: votaciones_api_docs
          uri: lb://votaciones-service
          predicates:
            - Path=/api/votaciones/v3/api-docs
          filters:
            - RewritePath=/api/votaciones/v3/api-docs, /v3/api-docs

        # --- Resultados/Estadísticas ---
        - id: resultados_swagger
          uri: lb://resultados-service
          predicates:
            - Path=/resultados/swagger-ui/**
          filters:
            - RewritePath=/resultados/swagger-ui/(?<segment>.*), /swagger-ui/$\{segment}

        - id: resultados_api_docs
          uri: lb://resultados-service
          predicates:
            - Path=/api/resultados/v3/api-docs
          filters:
            - RewritePath=/api/resultados/v3/api-docs, /v3/api-docs

        # --- Candidatos ---
        - id: candidatos_swagger
          uri: lb://candidatos
          predicates:
            - Path=/candidatos/swagger-ui/**
          filters:
            - RewritePath=/candidatos/swagger-ui/(?<segment>.*), /swagger-ui/$\{segment}

        - id: candidatos_api_docs
          uri: lb://candidatos
          predicates:
            - Path=/api/candidatos/v3/api-docs
          filters:
            - RewritePath=/api/candidatos/v3/api-docs, /v3/api-docs

        # --- Auditoría (docs vía gateway) ---
        - id: auditoria-openapi
          uri: lb://AUDITORIA-REGISTROS-SERVICE
          predicates:
            - Path=/api/auditoria/v3/api-docs
          filters:
            - RewritePath=/api/auditoria/v3/api-docs, /v3/api-docs

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
  instance:
    hostname: ${HOSTNAME:localhost}
    prefer-ip-address: false

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      enabled: true
    health:
      show-details: always

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: Auditoria Service
        url: /api/auditoria/v3/api-docs
      - name: Usuarios Service
        url: /api/usuarios/v3/api-docs
      - name: Votaciones Service
        url: /api/votaciones/v3/api-docs
      - name: Resultados Service
        url: /api/resultados/v3/api-docs
      - name: Candidatos Service
        url: /api/candidatos/v3/api-docs

logging:
  level:
    root: INFO
    '[org.springframework.cloud.gateway]': DEBUG
    '[org.springframework.cloud.loadbalancer]': DEBUG
    '[com.netflix.discovery]': DEBUG
    '[org.springframework.security]': TRACE
    '[org.springframework.security.oauth2]': TRACE