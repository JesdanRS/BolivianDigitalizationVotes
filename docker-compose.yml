services:
  # Base de datos 
  postgres-db-usuarios:
    image: postgres:16-alpine
    container_name: bd-usuarios
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=usuarios_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d usuarios_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - db-data-usuarios:/var/lib/postgresql/data
    networks:
      - votaciones-net

  postgres-db-auditoria:
    image: postgres:16-alpine
    container_name: bd-auditoria
    ports:
      - "5435:5432"
    environment:
      - POSTGRES_DB=auditoria_db
      - POSTGRES_USER=auditoria_user
      - POSTGRES_PASSWORD=auditoria_pass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auditoria_user -d auditoria_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - db-data-auditoria:/var/lib/postgresql/data
    networks:
      - votaciones-net


  eureka-server:
    build:
      context: ./eureka-server 
      dockerfile: Dockerfile   
    container_name: eureka-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - votaciones-net

  usuarios-service:
    build:
      context: .
      dockerfile: usuarios-service/Dockerfile
    container_name: ms-usuarios
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db-usuarios:5432/usuarios_db
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
    depends_on:
      postgres-db-usuarios:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - votaciones-net

  auditoria-service:
    build:
      context: .                # raíz del proyecto
      dockerfile: auditoria_registros-services/Dockerfile
    container_name: ms-auditoria
    hostname: ms-auditoria
    ports:
      - "8085:8085"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db-auditoria:5432/auditoria_db
      - SPRING_DATASOURCE_USERNAME=auditoria_user
      - SPRING_DATASOURCE_PASSWORD=auditoria_pass
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - HOSTNAME=ms-auditoria
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://host.docker.internal:8090/realms/votaciones
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres-db-auditoria:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - votaciones-net

  postgres-db-keycloak:
    image: postgres:16-alpine
    container_name: postgres-keycloak
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=keycloak
    volumes:
      - db-data-keycloak:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - votaciones-net

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: keycloak
    hostname: localhost
    ports:
      - "8090:8080"
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HTTP_ENABLED=true
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME_STRICT_HTTPS=false
      - KC_HOSTNAME_URL=http://localhost:8090
      - KC_HOSTNAME_ADMIN_URL=http://localhost:8090
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres-db-keycloak:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=keycloak
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
    command: start-dev
    depends_on:
      postgres-db-keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s
    networks:
      - votaciones-net

  api-gateway:
    build:
      context: ./api-gateway  
      dockerfile: Dockerfile  
    container_name: api-gateway
    hostname: api-gateway
    ports:
      - "8080:8080"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - HOSTNAME=api-gateway
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://host.docker.internal:8090/realms/votaciones
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      eureka-server:
        condition: service_healthy
      auditoria-service:
        condition: service_started
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - votaciones-net

volumes:
  db-data-usuarios:
  db-data-auditoria:
  db-data-keycloak:

networks:
  votaciones-net:
    driver: bridge
