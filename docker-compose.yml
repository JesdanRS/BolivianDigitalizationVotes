services:
  # Base de datos 
  postgres-db-usuarios:
    image: postgres:16-alpine
    container_name: bd-usuarios
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=usuarios_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d usuarios_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - db-data-usuarios:/var/lib/postgresql/data
    
  # AUDITORÍA
  postgres-db-auditoria:
    image: postgres:16-alpine
    container_name: bd-auditoria
    environment:
      - POSTGRES_USER=auditoria_user
      - POSTGRES_PASSWORD=auditoria_pass
      - POSTGRES_DB=auditoria_db
    ports:
      - "5435:5432"
    volumes:
      - db-data-auditoria:/var/lib/postgresql/data
    networks:
      - votaciones-net

  # Eureka Server 
  eureka-server:
    build:
      context: ./eureka-server 
      dockerfile: Dockerfile   
    container_name: eureka-server
    ports:
      - "8761:8761"

  # Usuarios Service
  usuarios-service:
    build:
      context: .
      dockerfile: usuarios-service/Dockerfile
    container_name: ms-usuarios
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db-usuarios:5432/usuarios_db
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
    depends_on:
      postgres-db-usuarios:
        condition: service_healthy
      eureka-server:
        condition: service_started

  # API Gateway 
  api-gateway:
    build:
      context: ./api-gateway  
      dockerfile: Dockerfile  
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
    depends_on:
      - eureka-server

volumes:
  db-data-usuarios:
  db-data-auditoria:

networks:
  votaciones-net:
    driver: bridge
  