services:
  # Base de datos (Sin cambios)
  postgres-db-usuarios:
    image: postgres:16-alpine
    container_name: bd-usuarios
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=usuarios_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d usuarios_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - db-data-usuarios:/var/lib/postgresql/data

  # Base de datos de votaciones
  postgres-db-votaciones:
    image: postgres:16-alpine
    container_name: bd-votaciones
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=votaciones_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d votaciones_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - db-data-votaciones:/var/lib/postgresql/data

  # Base de datos de resultados y estadísticas
  postgres-db-resultados:
    image: postgres:16-alpine
    container_name: bd-resultados
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_DB=resultados_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d resultados_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - db-data-resultados:/var/lib/postgresql/data

  # Eureka Server 
  # =======================================================
  # NUEVA INFRAESTRUCTURA: ZOOKEEPER (Requerido por Kafka)
  # =======================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # =======================================================
  # NUEVA INFRAESTRUCTURA: KAFKA (El sistema de mensajería)
  # =======================================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # Eureka Server (Sin cambios)
  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"

  # Usuarios Service (Sin acceso directo, solo por gateway)
  usuarios-service:
    build:
      context: .
      dockerfile: usuarios-service/Dockerfile
    container_name: ms-usuarios
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db-usuarios:5432/usuarios_db
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS=kafka:9092
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://host.docker.internal:8180/auth/realms/votaciones-realm/protocol/openid-connect/certs
    depends_on:
      postgres-db-usuarios:
        condition: service_healthy
      eureka-server:
        condition: service_started
      kafka:
        condition: service_started
      keycloak:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # =======================================================
  # KEYCLOAK - Servidor de Autenticación y Autorización
  # =======================================================
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: keycloak
    ports:
      - "8180:8080"
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HTTP_RELATIVE_PATH=/auth
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME_STRICT_HTTPS=false
      - KC_HTTP_ENABLED=true
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/votaciones-realm.json:/opt/keycloak/data/import/votaciones-realm.json
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Votaciones Service
  votaciones-service:
    build:
      context: .
      dockerfile: votaciones-service/Dockerfile
    container_name: ms-votaciones
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db-votaciones:5432/votaciones_db
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS=kafka:9092
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://host.docker.internal:8180/auth/realms/votaciones-realm/protocol/openid-connect/certs
    depends_on:
      postgres-db-votaciones:
        condition: service_healthy
      eureka-server:
        condition: service_started
      kafka:
        condition: service_started
      keycloak:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # API Gateway 
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
    depends_on:
      - eureka-server
      
  # =======================================================
  # NUEVO SERVICIO: NOTIFICACIONES
  # =======================================================
  notificaciones-service:
    build:
      context: . # Usa el contexto raíz para ver a dto-notificaciones
      dockerfile: notificaciones-service/Dockerfile
    container_name: ms-notificaciones
    depends_on:
      - eureka-server
      - kafka # Depende de que Eureka y Kafka estén iniciados
    environment:
      # Le decimos dónde encontrar Eureka y Kafka usando sus nombres de servicio
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS=kafka:9092

volumes:
  db-data-usuarios:
  db-data-votaciones:
  db-data-resultados: