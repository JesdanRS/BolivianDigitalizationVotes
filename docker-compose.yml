services:
  # Base de datos para Usuarios
  postgres-db-usuarios:
    image: postgres:16-alpine
    container_name: bd-usuarios
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=usuarios_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d usuarios_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - db-data-usuarios:/var/lib/postgresql/data

  # Base de datos para Candidatos
  postgres-db-candidatos:
    image: postgres:16-alpine
    container_name: bd-candidatos
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=candidatos_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d candidatos_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - db-data-candidatos:/var/lib/postgresql/data

  # =======================================================
  # NUEVA INFRAESTRUCTURA: ZOOKEEPER (Requerido por Kafka)
  # =======================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # =======================================================
  # NUEVA INFRAESTRUCTURA: KAFKA (El sistema de mensajería)
  # =======================================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # Eureka Server (Sin cambios)
  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"

  # Usuarios Service
  usuarios-service:
    build:
      context: .
      dockerfile: usuarios-service/Dockerfile
    container_name: ms-usuarios
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db-usuarios:5432/usuarios_db
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS=kafka:9092
    depends_on:
      postgres-db-usuarios:
        condition: service_healthy
      eureka-server:
        condition: service_started
      kafka:
        condition: service_started

  # Candidatos Service (NUEVO)
  candidatos-service:
    build:
      context: .
      dockerfile: candidatos/Dockerfile
    container_name: ms-candidatos
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db-candidatos:5432/candidatos_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS=kafka:9092
      - SERVER_PORT=8082
    depends_on:
      postgres-db-candidatos:
        condition: service_healthy
      eureka-server:
        condition: service_started
      kafka:
        condition: service_started

  # API Gateway (ACTUALIZADO CON SSL + OAuth2)
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8443:8443"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - SERVER_SSL_KEY_STORE=file:/keystore/edge-test.p12
      - SERVER_SSL_KEY_STORE_PASSWORD=password
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER-URI=http://keycloak.ucb.edu.bo:8080/realms/Candidatos-demo
    volumes:
      - $PWD/keystore:/keystore
    extra_hosts:
      - "keycloak.ucb.edu.bo:host-gateway"
    depends_on:
      - eureka-server
      - keycloak
      
  # =======================================================
  # NUEVO SERVICIO: NOTIFICACIONES
  # =======================================================
  notificaciones-service:
    build:
      context: . # Usa el contexto raíz para ver a dto-notificaciones
      dockerfile: notificaciones-service/Dockerfile
    container_name: ms-notificaciones
    depends_on:
      - eureka-server
      - kafka # Depende de que Eureka y Kafka estén iniciados
    environment:
      # Le decimos dónde encontrar Eureka y Kafka usando sus nombres de servicio
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS=kafka:9092

  # =======================================================
  # NUEVA INFRAESTRUCTURA: POSTGRESQL PARA KEYCLOAK
  # =======================================================
  postgres-keycloak:
    image: postgres:15
    container_name: postgres-keycloak
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =======================================================
  # NUEVA INFRAESTRUCTURA: KEYCLOAK (SERVIDOR DE AUTENTICACIÓN)
  # =======================================================
  keycloak:
    image: quay.io/keycloak/keycloak:25.0.1
    container_name: keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL_HOST: postgres-keycloak
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
    ports:
      - "8888:8080"
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data-usuarios:
  db-data-candidatos: