services:
  # Base de datos para Usuarios
  postgres-db-usuarios:
    image: postgres:16-alpine
    container_name: bd-usuarios
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=usuarios_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d usuarios_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - db-data-usuarios:/var/lib/postgresql/data
    networks:
      - votaciones-net

  # Base de datos para Auditoría
  postgres-db-auditoria:
    image: postgres:16-alpine
    container_name: bd-auditoria
    ports:
      - "5435:5432"
    environment:
      - POSTGRES_DB=auditoria_db
      - POSTGRES_USER=auditoria_user
      - POSTGRES_PASSWORD=auditoria_pass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auditoria_user -d auditoria_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - db-data-auditoria:/var/lib/postgresql/data
    networks:
      - votaciones-net

  # Base de datos de votaciones
  postgres-db-votaciones:
    image: postgres:16-alpine
    container_name: bd-votaciones
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=votaciones_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d votaciones_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - db-data-votaciones:/var/lib/postgresql/data
    networks:
      - votaciones-net

  # Base de datos para Candidatos
  postgres-db-candidatos:
    image: postgres:16-alpine
    container_name: bd-candidatos
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_DB=candidatos_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d candidatos_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - db-data-candidatos:/var/lib/postgresql/data
    networks:
      - votaciones-net

  # Base de datos de resultados y estadísticas
  postgres-db-resultados:
    image: postgres:16-alpine
    container_name: bd-resultados
    ports:
      - "5436:5432"   # ojo: cambié a 5436 para no chocar con auditoría
    environment:
      - POSTGRES_DB=resultados_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d resultados_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - db-data-resultados:/var/lib/postgresql/data
    networks:
      - votaciones-net

  # ==========================
  # Infraestructura Kafka
  # ==========================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - votaciones-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - votaciones-net

  # ==========================
  # Eureka Server
  # ==========================
  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - votaciones-net

  # ==========================
  # Keycloak + BD
  # ==========================
  postgres-db-keycloak:
    image: postgres:16-alpine
    container_name: postgres-keycloak
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=keycloak
    volumes:
      - db-data-keycloak:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - votaciones-net

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: keycloak
    hostname: localhost
    ports:
      - "8090:8080"
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HTTP_ENABLED=true
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME_STRICT_HTTPS=false
      - KC_HOSTNAME_URL=http://localhost:8090
      - KC_HOSTNAME_ADMIN_URL=http://localhost:8090
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres-db-keycloak:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=keycloak
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
    command: start-dev
    depends_on:
      postgres-db-keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s
    networks:
      - votaciones-net

  # ==========================
  # Microservicios
  # ==========================
  usuarios-service:
    build:
      context: .
      dockerfile: usuarios-service/Dockerfile
    container_name: ms-usuarios
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db-usuarios:5432/usuarios_db
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS=kafka:9092
      # ojo: este endpoint de Keycloak lo pueden ajustar luego al nuevo realm
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://host.docker.internal:8090/realms/votaciones/protocol/openid-connect/certs
    depends_on:
      postgres-db-usuarios:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_started
      keycloak:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - votaciones-net

  candidatos-service:
    build:
      context: .
      dockerfile: candidatos/Dockerfile
    container_name: ms-candidatos
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db-candidatos:5432/candidatos_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS=kafka:9092
      - SERVER_PORT=8082
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://host.docker.internal:8090/realms/votaciones/protocol/openid-connect/certs
    depends_on:
      postgres-db-candidatos:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - votaciones-net

  votaciones-service:
    build:
      context: .
      dockerfile: votaciones-service/Dockerfile
    container_name: ms-votaciones
    ports:
      - "8083:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db-votaciones:5432/votaciones_db
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS=kafka:9092
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://host.docker.internal:8090/realms/votaciones/protocol/openid-connect/certs
    depends_on:
      postgres-db-votaciones:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_started
      keycloak:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - votaciones-net

  resultados-estadisticas-service:
    build:
      context: .
      dockerfile: resultados_estadisticas/Dockerfile
    container_name: ms-resultados-estadisticas
    ports:
      - "8086:8086"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db-resultados:5432/resultados_db
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS=kafka:9092
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://host.docker.internal:8090/realms/votaciones/protocol/openid-connect/certs
    depends_on:
      postgres-db-resultados:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_started
      keycloak:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - votaciones-net

  auditoria-service:
    build:
      context: .
      dockerfile: auditoria_registros-services/Dockerfile
    container_name: ms-auditoria
    hostname: ms-auditoria
    ports:
      - "8085:8085"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db-auditoria:5432/auditoria_db
      - SPRING_DATASOURCE_USERNAME=auditoria_user
      - SPRING_DATASOURCE_PASSWORD=auditoria_pass
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - HOSTNAME=ms-auditoria
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://host.docker.internal:8090/realms/votaciones/protocol/openid-connect/certs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres-db-auditoria:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - votaciones-net

  # API Gateway
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    hostname: api-gateway
    ports:
      - "8080:8080"  # cambié a 8080 para alinear con tu app y healthcheck
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - HOSTNAME=api-gateway
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://host.docker.internal:8090/realms/votaciones/protocol/openid-connect/certs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      eureka-server:
        condition: service_healthy
      auditoria-service:
        condition: service_started
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - votaciones-net

  # Servicio de notificaciones
  notificaciones-service:
    build:
      context: .
      dockerfile: notificaciones-service/Dockerfile
    container_name: ms-notificaciones
    depends_on:
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS=kafka:9092
    networks:
      - votaciones-net

volumes:
  db-data-usuarios:
  db-data-auditoria:
  db-data-votaciones:
  db-data-candidatos:
  db-data-resultados:
  db-data-keycloak:

networks:
  votaciones-net:
    driver: bridge