spring.application.name=RESULTADOS-ESTADISTICAS-SERVICE
server.port=8086

# ===== Import OpenAPI Configuration =====
spring.config.import=optional:classpath:application-openapi.properties

# ===== Database Configuration =====
spring.datasource.url=jdbc:postgresql://localhost:5436/resultados_db
spring.datasource.username=resultados_user
spring.datasource.password=resultados_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA/Hibernate Configuration =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===== Security Configuration =====
# Configuración básica para desarrollo - ajustar según necesidades
spring.security.user.name=admin
spring.security.user.password=admin123

# ===== Eureka Client Configuration =====
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
eureka.instance.hostname=${HOSTNAME:localhost}
eureka.instance.prefer-ip-address=false

# ===== Actuator Configuration =====
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
