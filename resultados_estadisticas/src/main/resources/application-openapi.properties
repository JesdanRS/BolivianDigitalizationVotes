# ===== SpringDoc OpenAPI Configuration =====
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.packagesToScan=com.votaciones.resultados_estadisticas.controller
springdoc.pathsToMatch=/**
springdoc.override-with-generic-response=false

# ===== API Common Configuration =====
api.common.version=1.0.0
api.common.title=API Resultados y Estadísticas - Sistema de Votaciones
api.common.description=Microservicio para la gestión de resultados y estadísticas del sistema de votaciones electorales.
api.common.termsOfService=https://www.tuvotacion.com/terminos
api.common.license=Licencia MIT
api.common.licenseUrl=https://opensource.org/licenses/MIT
api.common.externalDocDesc=Documentación en Wiki
api.common.externalDocUrl=https://www.tuvotacion.com/wiki
api.common.contact.name=Soporte Sistema de Votaciones
api.common.contact.url=https://www.tuvotacion.com/contacto
api.common.contact.email=soporte@tuvotacion.com

# ===== API Response Codes =====
api.responseCodes.ok.description=OK
api.responseCodes.badRequest.description=Solicitud incorrecta, formato inválido o parámetros erróneos.
api.responseCodes.notFound.description=No encontrado, el id especificado no existe en los registros.
api.responseCodes.unprocessableEntity.description=Entidad no procesable, no se pueden procesar los parámetros de entrada.
