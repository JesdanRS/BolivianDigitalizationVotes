server:
  port: 8086

# =======================================================
# UNA ÚNICA CLAVE 'spring:' PARA TODA LA CONFIGURACIÓN
# =======================================================
spring:
  application:
    name: resultados-service

  # Sección de la Base de Datos
  datasource:
    url: jdbc:postgresql://localhost:5434/resultados_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  # Sección de JPA/Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Sección de Spring Cloud Stream (Kafka)
  cloud:
    stream:
      function:
        definition: procesarVotacion
      bindings:
        procesarVotacion-in-0:
          destination: topic-votaciones
      kafka:
        binder:
          brokers: localhost:9092

  # Sección de OAuth2 Resource Server (Keycloak)
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8180/auth/realms/votaciones-realm/protocol/openid-connect/certs

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true
    hostname: localhost

management:
  endpoints:
    web:
      exposure:
        include: "*"
