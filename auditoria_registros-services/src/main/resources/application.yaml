spring:
  application:
    name: auditoria_registros-service
  config:
    import: "classpath:application-openapi.yaml"
  datasource:
    url: jdbc:postgresql://localhost:5435/auditoria_db
    username: auditoria_user
    password: auditoria_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true
server:
  port: 7005
