server:
  port: 8085

spring:
  application:
    name: AUDITORIA-REGISTROS-SERVICE

  config:
    import: "classpath:application-openapi.yaml"

  datasource:
    url: jdbc:postgresql://localhost:5435/auditoria_db
    username: auditoria_user
    password: auditoria_pass
    driver-class-name: org.postgresql.Driver
    
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
  instance:
    hostname: ${HOSTNAME:localhost}
    prefer-ip-address: false

management:
  endpoints:
    web:
      exposure:
        include: "*"
