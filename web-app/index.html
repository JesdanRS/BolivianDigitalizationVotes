<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Candidatos - Bolivia</title>
    <!-- Keycloak -->
    <script src="https://cdn.jsdelivr.net/npm/keycloak-js@22.0.3/dist/keycloak.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bolivia-red: #D52B1E;
            --bolivia-yellow: #F9E300;
            --bolivia-green: #007934;
            --light-gray: #f5f5f5;
            --text-color: #333;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--light-gray);
            margin: 0;
            padding: 0;
            color: var(--text-color);
        }

        /* Banner Tricolor */
        .flag-strip {
            display: flex;
            height: 15px;
            width: 100%;
        }

        .flag-red {
            background-color: var(--bolivia-red);
            flex: 1;
        }

        .flag-yellow {
            background-color: var(--bolivia-yellow);
            flex: 1;
        }

        .flag-green {
            background-color: var(--bolivia-green);
            flex: 1;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        h1 {
            color: var(--bolivia-red);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .user-info {
            position: absolute;
            top: 0;
            right: 0;
            font-size: 0.9em;
            background: #eee;
            padding: 5px 10px;
            border-radius: 20px;
        }

        .actions-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        button {
            cursor: pointer;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: 500;
            transition: transform 0.1s, opacity 0.2s;
        }

        button:active {
            transform: scale(0.98);
        }

        button:hover {
            opacity: 0.9;
        }

        .btn-primary {
            background-color: var(--bolivia-green);
            color: white;
        }

        .btn-danger {
            background-color: var(--bolivia-red);
            color: white;
        }

        .btn-warning {
            background-color: #f39c12;
            color: white;
        }

        .btn-secondary {
            background-color: #95a5a6;
            color: white;
        }

        /* TABLA MÁS BONITA */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            text-align: left;
            padding: 12px 15px;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: var(--bolivia-red);
            color: white;
            text-transform: uppercase;
            font-size: 0.85em;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .action-buttons {
            display: flex;
            gap: 5px;
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 0.8em;
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            width: 600px;
            max-width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            border-top: 5px solid var(--bolivia-yellow);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .full-width {
            grid-column: span 2;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            font-size: 0.9em;
        }

        input,
        textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .modal-footer {
            margin-top: 20px;
            text-align: right;
        }

        .hidden {
            display: none !important;
        }

        #loading {
            text-align: center;
            padding: 20px;
            font-size: 1.2em;
            color: #666;
        }
    </style>
</head>

<body>

    <!-- Bandera Decorativa Superior -->
    <div class="flag-strip">
        <div class="flag-red"></div>
        <div class="flag-yellow"></div>
        <div class="flag-green"></div>
    </div>

    <div id="login-screen" class="container" style="text-align: center; margin-top: 100px;">
        <h1>🗳️ Sistema Electoral Bolivia</h1>
        <p>Por favor inicie sesión para acceder al sistema.</p>
        <button onclick="login()" class="btn-primary" style="font-size: 1.2em; padding: 15px 30px;">
            🔐 Entrar con Keycloak
        </button>
    </div>

    <div id="app-screen" class="container hidden">
        <header>
            <div class="user-info">
                Usuario: <strong id="username">...</strong> | Rol: <span id="user-role">...</span>
                <button onclick="logout()" class="btn-sm btn-danger" style="margin-left: 10px;">Salir</button>
            </div>
            <h1>Gestión de Candidatos</h1>
            <p style="color: #666;">Administración Nacional de Candidaturas 2025</p>
        </header>

        <div class="actions-bar">
            <button onclick="openModal()" class="btn-primary">+ Nuevo Candidato</button>
            <button onclick="loadCandidatos()" class="btn-secondary">↻ Actualizar</button>
        </div>

        <div id="loading" class="hidden">Cargando datos...</div>

        <table id="candidates-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Partido</th>
                    <th>Presidente</th>
                    <th>Vicepresidente</th>
                    <th>Descripción</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <!-- Filas dinámicas aquí -->
            </tbody>
        </table>
    </div>

    <!-- MODAL FORMULARIO -->
    <div id="candidate-modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title" style="margin-top:0;">Nuevo Candidato</h2>
            <form id="candidate-form" onsubmit="saveCandidate(event)">
                <input type="hidden" id="cand-id">

                <div class="form-grid">
                    <div class="full-width">
                        <label>Partido Político</label>
                        <input type="text" id="partido" required placeholder="Ej: MAS, CC, CREEMOS">
                    </div>

                    <div>
                        <label>Nombre Presidente</label>
                        <input type="text" id="nombreP" required>
                    </div>
                    <div>
                        <label>Carnet Presidente</label>
                        <input type="text" id="carnetP" required>
                    </div>
                    <div>
                        <label>Fecha Nac. Presidente</label>
                        <input type="date" id="nacP" required>
                    </div>

                    <div><!-- Espaciador --></div>

                    <div>
                        <label>Nombre Vicepresidente</label>
                        <input type="text" id="nombreV" required>
                    </div>
                    <div>
                        <label>Carnet Vicepresidente</label>
                        <input type="text" id="carnetV" required>
                    </div>
                    <div>
                        <label>Fecha Nac. Vicepresidente</label>
                        <input type="date" id="nacV" required>
                    </div>

                    <div class="full-width">
                        <label>Correo Electrónico</label>
                        <input type="email" id="email" required>
                    </div>

                    <div class="full-width">
                        <label>Descripción / Propuesta</label>
                        <textarea id="descripcion" rows="3"></textarea>
                    </div>

                    <div class="full-width" style="background: #fff3cd; padding: 10px; border-radius: 4px;">
                        <label>CI Usuario (Auditoría)</label>
                        <input type="text" id="ciUsuario" required placeholder="CI de quien registra" value="123456">
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" onclick="closeModal()" class="btn-secondary">Cancelar</button>
                    <button type="submit" class="btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // --- CONFIGURACIÓN ---
        const API_URL = 'http://localhost:8080/ms-candidatos/api/candidatos';

        const keycloak = new Keycloak({
            url: 'http://localhost:8090',
            realm: 'votaciones',
            clientId: 'votaciones-app'
        });

        let currentUserToken = null;

        // --- INICIALIZACIÓN ---
        keycloak.init({ onLoad: 'check-sso' }).then(authenticated => {
            if (authenticated) {
                currentUserToken = keycloak.token;
                console.log("🔑 TU TOKEN PARA POSTMAN:");
                console.log(keycloak.token); // <--- COPIA ESTO
                showApp(keycloak.tokenParsed);
                loadCandidatos();
            } else {
                document.getElementById('login-screen').classList.remove('hidden');
                document.getElementById('app-screen').classList.add('hidden');
            }
        }).catch(err => {
            console.error(err);
            alert('Error conectando con Keycloak');
        });

        function login() { keycloak.login(); }
        function logout() { keycloak.logout(); }

        function showApp(tokenData) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            document.getElementById('username').innerText = tokenData.preferred_username;
            document.getElementById('user-role').innerText =
                (tokenData.realm_access?.roles || []).includes('admin') ? 'ADMINISTRADOR' : 'USUARIO';
        }

        // --- CRUD API ---

        async function loadCandidatos() {
            document.getElementById('loading').classList.remove('hidden');
            const tbody = document.querySelector('#candidates-table tbody');
            tbody.innerHTML = '';

            try {
                const res = await fetch(API_URL, {
                    headers: { 'Authorization': `Bearer ${currentUserToken}` }
                });

                if (!res.ok) throw new Error('Error al cargar datos');

                const data = await res.json();

                data.forEach(c => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${c.id}</td>
                            <td><strong>${c.partido}</strong></td>
                            <td>${c.nombreCompletoPresidente} (${c.carnetPresidente})</td>
                            <td>${c.nombreCompletoVicepresidente} (${c.carnetVicepresidente})</td>
                            <td>${c.descripcion || '-'}</td>
                            <td>
                                <div class="action-buttons">
                                    <button onclick='editInit(${JSON.stringify(c)})' class="btn-sm btn-warning">Editar</button>
                                    <button onclick="deleteCandidate(${c.id})" class="btn-sm btn-danger">Eliminar</button>
                                </div>
                            </td>
                        </tr>
                    `;
                });

                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center">No hay candidatos registrados.</td></tr>';
                }

            } catch (e) {
                alert('Error: ' + e.message);
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        }

        async function saveCandidate(e) {
            e.preventDefault();
            const id = document.getElementById('cand-id').value;

            const dto = {
                partido: document.getElementById('partido').value,
                nombreCompletoPresidente: document.getElementById('nombreP').value,
                carnetPresidente: document.getElementById('carnetP').value,
                fechaNacimientoPresidente: document.getElementById('nacP').value,
                nombreCompletoVicepresidente: document.getElementById('nombreV').value,
                carnetVicepresidente: document.getElementById('carnetV').value,
                fechaNacimientoVicepresidente: document.getElementById('nacV').value,
                correoElectronico: document.getElementById('email').value,
                descripcion: document.getElementById('descripcion').value,
                ciUsuario: document.getElementById('ciUsuario').value
            };

            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_URL}/${id}` : API_URL;

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: {
                        'Authorization': `Bearer ${currentUserToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(dto)
                });

                if (res.ok) {
                    closeModal();
                    loadCandidatos();
                    alert(id ? 'Actualizado correctamente' : 'Creado correctamente');
                } else {
                    const errorTxt = await res.text();
                    alert('Error al guardar: ' + errorTxt);
                }
            } catch (err) {
                alert('Error de red: ' + err.message);
            }
        }

        async function deleteCandidate(id) {
            if (!confirm('¿Seguro de eliminar este candidato? Esta acción no se puede deshacer.')) return;

            const ci = prompt("Por favor, confirma tu CI para auditoría:", "123456");
            if (!ci) return;

            try {
                const res = await fetch(`${API_URL}/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${currentUserToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ ciUsuario: ci }) // Body requerido para auditoría
                });

                if (res.ok) {
                    loadCandidatos();
                } else {
                    alert('Error al eliminar');
                }
            } catch (err) {
                alert('Error de red');
            }
        }

        // --- FUNCIONES UI ---

        function openModal() {
            document.getElementById('candidate-form').reset();
            document.getElementById('cand-id').value = '';
            document.getElementById('modal-title').innerText = 'Nuevo Candidato';
            document.getElementById('candidate-modal').style.display = 'flex';
        }

        function editInit(c) {
            document.getElementById('cand-id').value = c.id;
            document.getElementById('partido').value = c.partido;
            document.getElementById('nombreP').value = c.nombreCompletoPresidente;
            document.getElementById('carnetP').value = c.carnetPresidente;
            document.getElementById('nacP').value = c.fechaNacimientoPresidente;
            document.getElementById('nombreV').value = c.nombreCompletoVicepresidente;
            document.getElementById('carnetV').value = c.carnetVicepresidente;
            document.getElementById('nacV').value = c.fechaNacimientoVicepresidente;
            document.getElementById('email').value = c.correoElectronico;
            document.getElementById('descripcion').value = c.descripcion;

            document.getElementById('modal-title').innerText = 'Editar Candidato #' + c.id;
            document.getElementById('candidate-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('candidate-modal').style.display = 'none';
        }

        // Cerrar modal al hacer click afuera
        window.onclick = function (event) {
            const modal = document.getElementById('candidate-modal');
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>
</body>

</html>
