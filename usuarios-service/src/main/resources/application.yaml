spring:
  application:
    name: usuarios-service

  config:
    import: "configserver:"

  cloud:
    config:
      fail-fast: true
      retry:
        initial-interval: 3000
        multiplier: 1.3
        max-interval: 10000
        max-attempts: 20
      username: ${CONFIG_SERVER_USR:config-usr}
      password: ${CONFIG_SERVER_PWD:Config2025!}

    # Kafka Stream bindings para enviar notificaciones
    stream:
      kafka:
        binder:
          brokers: ${SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS:localhost:9092}
      bindings:
        # Output binding: envía códigos de verificación al topic de notificaciones
        enviarNotificacion-out-0:
          destination: topic-notificaciones
          content-type: application/json
---
# ========================================
# PERFIL LOCAL
# ========================================
spring:
  config:
    activate:
      on-profile: local
  cloud:
    config:
      uri: http://localhost:8888

---
# ========================================
# PERFIL DOCKER
# ========================================
spring:
  config:
    activate:
      on-profile: docker
  cloud:
    config:
      uri: http://config-server:8888
