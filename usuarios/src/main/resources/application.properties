spring.application.name=usuarios

# Configuración del servidor
server.port=8080

# Configuración de OpenAPI/Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Configuración de la API
api.common.title=API Usuarios - Sistema de Votaciones Bolivianas
api.common.description=Microservicio para la gestión de usuarios en el sistema de digitalización de votaciones bolivianas
api.common.version=1.0.0
api.common.termsOfService=https://www.bolivia.gob.bo/terminos
api.common.license=Licencia Pública General v3.0
api.common.licenseUrl=https://www.gnu.org/licenses/gpl-3.0.html
api.common.contact.name=Equipo de Desarrollo - Sistema de Votaciones
api.common.contact.url=https://www.bolivia.gob.bo/contacto
api.common.contact.email=soporte.votaciones@bolivia.gob.bo
api.common.externalDocDesc=Documentación del Sistema de Votaciones
api.common.externalDocUrl=https://www.bolivia.gob.bo/sistema-votaciones

# Configuración de logging
logging.level.com.votaciones.usuarios=DEBUG
logging.level.org.springframework.web=INFO
