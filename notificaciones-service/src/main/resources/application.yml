server:
  port: 8083

spring:
  application:
    name: notificaciones-service

  cloud:
    function:
      # Activamos las DOS funciones del servicio
      definition: procesarNotificacion;recibirEventoCandidatos

    stream:
      default-binder: kafka

      bindings:
        # 1) Consumer para correos (NotificacionDto) desde topic-notificaciones
        procesarNotificacion-in-0:
          destination: topic-notificaciones
          group: notificaciones-email-group
          content-type: application/json

        # 2) Consumer para eventos de candidatos desde 'notificaciones'
        recibirEventoCandidatos-in-0:
          destination: notificaciones
          group: notificaciones-candidatos-group
          content-type: application/json

      kafka:
        binder:
          brokers: ${SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS:localhost:9092}

  # Configuración de email (Mailtrap para desarrollo)
  # Para habilitar el envío real de emails, configura estas variables de entorno:
  # MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD, APP_EMAIL_ENABLED=true
  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Configuración de la aplicación
app:
  email:
    # Por defecto deshabilitado - los códigos se ven en los logs
    # Para habilitar: APP_EMAIL_ENABLED=true
    enabled: ${APP_EMAIL_ENABLED:false}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    hostname: localhost

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    root: INFO
    com.votaciones: DEBUG
