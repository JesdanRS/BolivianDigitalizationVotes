spring:
  application:
    name: candidatos
  datasource:
    url: jdbc:postgresql://localhost:5433/candidatos_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  cloud:
    stream:
      kafka:
        binder:
          brokers: localhost:9092
      bindings:
        enviarNotificacion-out-0:
          destination: notificaciones
          content-type: application/json

server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.votaciones: DEBUG