spring:
  application:
    name: candidatos
  datasource:
    url: jdbc:postgresql://postgres-db-candidatos:5432/candidatos_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  cloud:
    stream:
      kafka:
        binder:
          brokers: kafka:9092
      bindings:
        enviarNotificacion-out-0:
          destination: notificaciones
          content-type: application/json
  security:
    oauth2:
      resourceserver:
        jwt:
          # Desde Docker, usa la IP del gateway (172.17.0.1 en Windows con Docker Desktop)
          jwk-set-uri: http://172.17.0.1:8888/realms/master/protocol/openid-connect/certs

server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    hostname: candidatos-service

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.votaciones: DEBUG
    org.springframework.security: DEBUG
